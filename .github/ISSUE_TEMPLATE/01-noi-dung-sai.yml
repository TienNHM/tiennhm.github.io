name: Nội dung sai
description: Một bài viết hoặc trang tài liệu nói điều không đúng
title: "[Nội dung] "
labels: ["nội dung", "cần kiểm chứng"]
body:
  - type: markdown
    attributes:
      value: |
        Đây là loại issue có giá trị nhất với trang này. Cảm ơn bạn đã dành thời gian.

  - type: input
    id: url
    attributes:
      label: Trang nào
      description: Dán URL đầy đủ
      placeholder: https://tiennhm.io.vn/blog/...
    validations:
      required: true

  - type: textarea
    id: claim
    attributes:
      label: Bài viết đang nói gì
      description: Trích đúng câu hoặc đoạn bạn cho là sai
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Theo bạn thì đúng là gì
      description: Nêu rõ điều đúng, và vì sao
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Bạn dựa trên đâu
      description: |
        Số đo bạn tự chạy, tài liệu gốc, hoặc trải nghiệm thật của bạn.
        Nếu là số đo, ghi cả phiên bản và môi trường — hai thứ đó thường
        giải thích được vì sao hai người ra hai kết quả khác nhau.
    validations:
      required: true
