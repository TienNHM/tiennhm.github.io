name: Đề xuất chủ đề hoặc cải tiến
description: Gợi ý một chủ đề nên viết, hoặc một cải tiến cho trang
title: "[Đề xuất] "
labels: ["đề xuất"]
body:
  - type: markdown
    attributes:
      value: |
        Lưu ý: đây là blog cá nhân viết ở ngôi thứ nhất về trải nghiệm thật.
        Tôi chỉ viết được về thứ mình đã tự làm, nên không phải đề xuất nào
        cũng thành bài — nhưng gợi ý vẫn luôn được đọc.

  - type: dropdown
    id: kind
    attributes:
      label: Loại đề xuất
      options:
        - Chủ đề nên viết
        - Cải tiến cho trang
        - Bổ sung cho khoá .NET
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Nội dung đề xuất
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Vì sao nó đáng làm
      description: Vấn đề nào đang chưa được giải quyết?
    validations:
      required: true
