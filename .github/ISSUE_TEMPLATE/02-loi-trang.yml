name: Lỗi trang web
description: Trang hiển thị sai, link hỏng, hoặc chức năng không chạy
title: "[Lỗi] "
labels: ["lỗi"]
body:
  - type: input
    id: url
    attributes:
      label: Trang nào
      placeholder: https://tiennhm.io.vn/...
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: Bạn thấy gì
      description: Mô tả hiện tượng. Kèm ảnh chụp màn hình thì tốt nhất.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Bạn mong thấy gì
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Thiết bị
      options:
        - Máy tính
        - Điện thoại
        - Máy tính bảng
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Trình duyệt và phiên bản
      placeholder: Chrome 131, Safari trên iOS 18...

  - type: checkboxes
    id: checked
    attributes:
      label: Trước khi gửi
      options:
        - label: Tôi đã thử tải lại trang và xoá bộ nhớ đệm
