<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loại kiểm thử nào chạy ở bước nào</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Kiểm thử API trong CI/CD</p>
    <h1>Loại kiểm thử nào chạy ở bước nào</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="api-testing-pipeline-dark-title api-testing-pipeline-dark-desc">
  <title id="api-testing-pipeline-dark-title">Vị trí các loại kiểm thử API trong pipeline CI/CD</title>
  <desc id="api-testing-pipeline-dark-desc">Mỗi pull request chạy unit, functional và integration test dưới mười phút; sau merge chạy toàn bộ regression; ngay sau deploy chạy smoke test trên môi trường thật và tự rollback nếu đỏ. Load, fuzz, security scan chạy định kỳ hàng đêm hoặc hàng tuần, stress test chạy trước sự kiện tải cao, cả hai không chặn đường merge.</desc>
  <defs>
    <marker id="api-testing-pipeline-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
    <marker id="api-testing-pipeline-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#1b1b1d"/>
  <g transform="translate(0,-48)">
  <!-- Lane 1 label -->
  <text x="20" y="72" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ĐƯỜNG CHÍNH · MỖI THAY ĐỔI ĐỀU ĐI QUA</text>

  <!-- Arrows first -->
  <line x1="200" y1="112" x2="280" y2="112" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#api-testing-pipeline-dark-arrow)"/>
  <line x1="440" y1="112" x2="520" y2="112" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#api-testing-pipeline-dark-arrow)"/>
  <line x1="680" y1="112" x2="760" y2="112" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#api-testing-pipeline-dark-arrow)"/>
  <line x1="120" y1="136" x2="120" y2="184" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#api-testing-pipeline-dark-arrow)"/>
  <line x1="360" y1="136" x2="360" y2="184" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#api-testing-pipeline-dark-arrow)"/>
  <line x1="840" y1="136" x2="840" y2="184" stroke="#25c19f" stroke-width="1.4" marker-end="url(#api-testing-pipeline-dark-arrow-accent)"/>
  <line x1="740" y1="216" x2="700" y2="216" stroke="#b4b9c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#api-testing-pipeline-dark-arrow)"/>

  <!-- Arrow label -->
  <rect x="708" y="192" width="24" height="12" rx="2" fill="#1b1b1d"/><text x="720" y="201" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ĐỎ</text>

  <!-- Stages -->
  <rect x="40" y="88" width="160" height="48" rx="6" fill="#1b1b1d"/>
  <rect x="40" y="88" width="160" height="48" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
  <text x="120" y="116" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pull request</text>

  <rect x="280" y="88" width="160" height="48" rx="6" fill="#1b1b1d"/>
  <rect x="280" y="88" width="160" height="48" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
  <text x="360" y="116" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Merge</text>

  <rect x="520" y="88" width="160" height="48" rx="6" fill="#1b1b1d"/>
  <rect x="520" y="88" width="160" height="48" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
  <text x="600" y="116" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Deploy</text>

  <rect x="760" y="88" width="160" height="48" rx="6" fill="#1b1b1d"/>
  <rect x="760" y="88" width="160" height="48" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
  <text x="840" y="116" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Môi trường thật</text>

  <!-- Test gates -->
  <rect x="20" y="184" width="200" height="64" rx="6" fill="#1b1b1d"/>
  <rect x="20" y="184" width="200" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="120" y="212" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Functional + Integration</text>
  <text x="120" y="229" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kèm unit test · &lt; 10 phút</text>

  <rect x="260" y="184" width="200" height="64" rx="6" fill="#1b1b1d"/>
  <rect x="260" y="184" width="200" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="360" y="212" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Regression</text>
  <text x="360" y="229" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">toàn bộ test sẵn có</text>

  <rect x="500" y="184" width="200" height="64" rx="6" fill="#1b1b1d"/>
  <rect x="500" y="184" width="200" height="64" rx="6" fill="rgba(227,227,227,0.02)" stroke="rgba(227,227,227,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="600" y="212" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rollback tự động</text>
  <text x="600" y="229" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">không chờ test khác</text>

  <rect x="740" y="184" width="200" height="64" rx="6" fill="#1b1b1d"/>
  <rect x="740" y="184" width="200" height="64" rx="6" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1.2"/>
  <text x="840" y="212" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Smoke test</text>
  <text x="840" y="229" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ngay sau deploy</text>

  <!-- Lane 2 -->
  <line x1="20" y1="288" x2="940" y2="288" stroke="rgba(227,227,227,0.10)" stroke-width="0.8"/>
  <text x="20" y="312" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHẠY RIÊNG · KHÔNG CHẶN ĐƯỜNG MERGE</text>

  <rect x="20" y="328" width="320" height="64" rx="6" fill="#1b1b1d"/>
  <rect x="20" y="328" width="320" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="180" y="356" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Load · Fuzz · Security scan</text>
  <text x="180" y="373" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hàng đêm hoặc hàng tuần · chậm và ồn</text>

  <rect x="380" y="328" width="240" height="64" rx="6" fill="#1b1b1d"/>
  <rect x="380" y="328" width="240" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="500" y="356" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stress test</text>
  <text x="500" y="373" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trước sự kiện tải cao</text>
  </g>
<text id="tiennhm-copyright" x="936" y="392" text-anchor="end" fill="#b4b9c0" opacity="0.75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
