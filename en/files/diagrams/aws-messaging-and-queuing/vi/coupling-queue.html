<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tightly coupled và loosely coupled với message queue</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafaf7;
      --color-ink:    #1c1e21;
      --color-muted:  #525860;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Messaging &amp; Queuing</p>
    <h1>Message queue tách rời hai ứng dụng</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="coupling-queue-title coupling-queue-desc">
  <title id="coupling-queue-title">Tightly coupled và loosely coupled với message queue</title>
  <desc id="coupling-queue-desc">Ở kiến trúc tightly coupled, App A gọi trực tiếp App B nên khi B lỗi thì A lỗi theo. Ở loosely coupled, App A đẩy message vào queue và App B lấy ra xử lý, nên khi B lỗi message vẫn nằm trong queue và A không bị ảnh hưởng.</desc>
  <defs>
    <marker id="cq-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
    <marker id="cq-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#18816a"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#fafaf7"/>

  <!-- Zone 1: tightly coupled -->
  <rect x="80" y="48" width="800" height="120" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
  <rect x="96" y="52" width="148" height="12" rx="2" fill="#fafaf7"/>
  <text x="170" y="61" fill="#525860" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TIGHTLY COUPLED</text>

  <line x1="320" y1="116" x2="552" y2="116" stroke="#525860" stroke-width="1.2" marker-end="url(#cq-arrow)"/>
  <rect x="396" y="96" width="80" height="12" rx="2" fill="#fafaf7"/><text x="436" y="105" fill="#525860" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GỌI TRỰC TIẾP</text>

  <rect x="140" y="88" width="180" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
  <text x="230" y="113" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application A</text>
  <text x="230" y="129" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bên gửi</text>

  <rect x="552" y="88" width="180" height="56" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
  <text x="642" y="113" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application B</text>
  <text x="642" y="129" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">B lỗi → A lỗi theo</text>

  <!-- Zone 2: loosely coupled -->
  <rect x="80" y="216" width="800" height="120" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
  <rect x="96" y="220" width="152" height="12" rx="2" fill="#fafaf7"/>
  <text x="172" y="229" fill="#525860" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOOSELY COUPLED</text>

  <line x1="320" y1="284" x2="392" y2="284" stroke="#525860" stroke-width="1.2" marker-end="url(#cq-arrow)"/>
  <line x1="568" y1="284" x2="640" y2="284" stroke="#18816a" stroke-width="1.4" marker-end="url(#cq-arrow-accent)"/>
  <rect x="332" y="264" width="48" height="12" rx="2" fill="#fafaf7"/><text x="356" y="273" fill="#525860" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ĐẨY</text>
  <rect x="580" y="264" width="48" height="12" rx="2" fill="#fafaf7"/><text x="604" y="273" fill="#18816a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LẤY</text>

  <rect x="140" y="256" width="180" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
  <text x="230" y="281" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application A</text>
  <text x="230" y="297" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bên gửi</text>

  <rect x="392" y="256" width="176" height="56" rx="6" fill="rgba(24,129,106,0.08)" stroke="#18816a" stroke-width="1"/>
  <text x="480" y="281" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Message Queue</text>
  <text x="480" y="297" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đệm message</text>

  <rect x="640" y="256" width="180" height="56" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
  <text x="730" y="281" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application B</text>
  <text x="730" y="297" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">B lỗi → message chờ</text>

  <!-- Legend -->
  <line x1="40" y1="380" x2="920" y2="380" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
  <text x="40" y="400" fill="#525860" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
  <line x1="40" y1="420" x2="68" y2="420" stroke="#525860" stroke-width="1.2" marker-end="url(#cq-arrow)"/>
  <text x="76" y="423" fill="#525860" font-size="8.5" font-family="'Geist', sans-serif">Luồng gọi / gửi message</text>
  <line x1="300" y1="420" x2="328" y2="420" stroke="#18816a" stroke-width="1.4" marker-end="url(#cq-arrow-accent)"/>
  <text x="336" y="423" fill="#525860" font-size="8.5" font-family="'Geist', sans-serif">Queue giữ message cho tới khi B sẵn sàng</text>
<text id="tiennhm-copyright" x="936" y="472" text-anchor="end" fill="#525860" opacity="0.75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
