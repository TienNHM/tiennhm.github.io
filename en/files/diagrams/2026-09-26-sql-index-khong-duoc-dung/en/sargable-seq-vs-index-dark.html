<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wrapping the column vs rewriting as a range</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · EXPLAIN ANALYZE, PostgreSQL 16</p>
    <h1>Wrapping the column vs rewriting as a range</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sargable-seq-vs-index-dark-title sargable-seq-vs-index-dark-desc">
  <title id="sargable-seq-vs-index-dark-title">Wrapping the column vs rewriting as a range</title>
  <desc id="sargable-seq-vs-index-dark-desc">A date_part condition wrapped around tao_luc leads to a Seq Scan reading all 200,000 rows and discarding 162,482, taking 29.6 ms, with the planner estimating 1,000 rows against 37,518 actual. A range condition on the bare column leads to a Bitmap Index Scan on idx_don_tao_luc then a Bitmap Heap Scan, taking 5.4 ms, estimating 38,225 rows against 37,518 actual.</desc>
  <defs>
    <marker id="sargable-seq-vs-index-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
    <marker id="sargable-seq-vs-index-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#1b1b1d"/>
  <text x="32" y="52" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">WHERE CONDITION</text>
  <text x="320" y="52" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">ACCESS PATH</text>
  <text x="776" y="52" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">TIME · ROW COUNT</text>
  <line x1="32" y1="64" x2="928" y2="64" stroke="rgba(227,227,227,0.1)" stroke-width="0.8"/>
  <path d="M280 132 L320 132" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#sargable-seq-vs-index-dark-arrow)"/>
  <path d="M736 132 L776 132" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#sargable-seq-vs-index-dark-arrow)"/>
  <path d="M280 276 L320 276" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#sargable-seq-vs-index-dark-arrow)"/>
  <path d="M504 276 L552 276" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#sargable-seq-vs-index-dark-arrow)"/>
  <path d="M736 276 L776 276" stroke="#25c19f" stroke-width="1.4" fill="none" marker-end="url(#sargable-seq-vs-index-dark-arrow-accent)"/>
  <rect x="32" y="96" width="248" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="32" y="96" width="248" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="156" y="122" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Function wraps the column</text><text x="156" y="137" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">date_part('year', tao_luc)</text><text x="156" y="151" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">= 2026</text>
  <rect x="320" y="96" width="416" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="320" y="96" width="416" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="528" y="122" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seq Scan on don</text><text x="528" y="137" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">computes date_part on all 200,000 rows</text><text x="528" y="151" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Filter throws away 162,482 rows</text>
  <rect x="776" y="96" width="152" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="776" y="96" width="152" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="852" y="122" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">29.6 ms</text><text x="852" y="137" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">est. 1,000 rows</text><text x="852" y="151" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">actual 37,518 rows</text>
  <rect x="32" y="240" width="248" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="32" y="240" width="248" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="156" y="266" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Range on the bare column</text><text x="156" y="281" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tao_luc &gt;= '2026-01-01'</text><text x="156" y="295" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AND tao_luc &lt; '2027-01-01'</text>
  <rect x="320" y="240" width="184" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="320" y="240" width="184" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="412" y="266" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bitmap Index Scan</text><text x="412" y="281" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">idx_don_tao_luc</text><text x="412" y="295" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jumps to the 2026 range</text>
  <rect x="552" y="240" width="184" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="552" y="240" width="184" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="644" y="266" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bitmap Heap Scan</text><text x="644" y="281" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reads matching pages only</text><text x="644" y="295" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">37,518 rows</text>
  <rect x="776" y="240" width="152" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="776" y="240" width="152" height="72" rx="6" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>
  <text x="852" y="266" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5.4 ms</text><text x="852" y="281" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">est. 38,225 rows</text><text x="852" y="295" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">actual 37,518 rows</text>
  <line x1="32" y1="344" x2="928" y2="344" stroke="rgba(227,227,227,0.1)" stroke-width="0.8"/>
  <text x="32" y="364" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="32" y="380" width="24" height="12" rx="2" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="64" y="390" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif">Execution plan node</text>
  <rect x="197" y="380" width="24" height="12" rx="2" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>
  <text x="229" y="390" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif">Plan that uses the index</text>

</svg>
    </div>
  </div>
</body>
</html>
