<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Same row: NOT IN drops it, NOT EXISTS keeps it</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafaf7;
      --color-ink:    #1c1e21;
      --color-muted:  #525860;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Three-valued logic</p>
    <h1>Same row: NOT IN drops it, NOT EXISTS keeps it</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="not-in-vs-not-exists-title not-in-vs-not-exists-desc">
  <title id="not-in-vs-not-exists-title">Same row: NOT IN drops it, NOT EXISTS keeps it</title>
  <desc id="not-in-vs-not-exists-desc">A row with thanh_pho = 'HCM' goes down two branches. NOT IN expands to 'HCM' &lt;&gt; NULL, which is UNKNOWN, so WHERE drops the row and the whole query returns 0 rows. NOT EXISTS runs the subquery, NULL = 'HCM' does not match, the subquery is empty, NOT EXISTS is TRUE and the row is kept, so the whole query returns 3 rows.</desc>
  <defs>
    <marker id="not-in-vs-not-exists-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
    <marker id="not-in-vs-not-exists-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#18816a"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#fafaf7"/>
  <path d="M440 72 V88 Q440 96 432 96 H308 Q300 96 300 104 V128" stroke="#525860" stroke-width="1.2" fill="none" marker-end="url(#not-in-vs-not-exists-arrow)"/>
  <path d="M520 72 V88 Q520 96 528 96 H652 Q660 96 660 104 V128" stroke="#525860" stroke-width="1.2" fill="none" marker-end="url(#not-in-vs-not-exists-arrow)"/>
  <path d="M300 184 L300 216" stroke="#525860" stroke-width="1.2" fill="none" marker-end="url(#not-in-vs-not-exists-arrow)"/>
  <path d="M660 184 L660 216" stroke="#525860" stroke-width="1.2" fill="none" marker-end="url(#not-in-vs-not-exists-arrow)"/>
  <path d="M300 272 L300 296" stroke="#525860" stroke-width="1.2" fill="none" marker-end="url(#not-in-vs-not-exists-arrow)"/>
  <path d="M660 272 L660 296" stroke="#525860" stroke-width="1.2" fill="none" marker-end="url(#not-in-vs-not-exists-arrow)"/>
  <path d="M300 376 L300 416" stroke="#525860" stroke-width="1.2" fill="none" marker-end="url(#not-in-vs-not-exists-arrow)"/>
  <path d="M660 376 L660 416" stroke="#18816a" stroke-width="1.4" fill="none" marker-end="url(#not-in-vs-not-exists-arrow-accent)"/>
  <rect x="346" y="78" width="48" height="12" rx="2" fill="#fafaf7"/><text x="370" y="87" fill="#525860" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NOT IN</text>
  <rect x="555" y="78" width="70" height="12" rx="2" fill="#fafaf7"/><text x="590" y="87" fill="#525860" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NOT EXISTS</text>
  <rect x="308" y="390" width="24" height="12" rx="2" fill="#fafaf7"/><text x="320" y="399" fill="#525860" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
  <rect x="668" y="390" width="30" height="12" rx="2" fill="#fafaf7"/><text x="683" y="399" fill="#18816a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
  <rect x="360" y="24" width="240" height="48" rx="20" fill="#fafaf7"/>
  <rect x="360" y="24" width="240" height="48" rx="20" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.3)" stroke-width="1"/>
  <text x="480" y="45" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One row of kh</text><text x="480" y="60" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">thanh_pho = 'HCM'</text>
  <rect x="180" y="128" width="240" height="56" rx="6" fill="#fafaf7"/>
  <rect x="180" y="128" width="240" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
  <text x="300" y="153" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Expand NOT IN</text><text x="300" y="168" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">'HCM' &lt;&gt; NULL</text>
  <rect x="540" y="128" width="240" height="56" rx="6" fill="#fafaf7"/>
  <rect x="540" y="128" width="240" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
  <text x="660" y="153" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run the subquery</text><text x="660" y="168" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NULL = 'HCM' → no match</text>
  <rect x="180" y="216" width="240" height="56" rx="6" fill="#fafaf7"/>
  <rect x="180" y="216" width="240" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
  <text x="300" y="241" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Result: UNKNOWN</text><text x="300" y="256" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">neither TRUE nor FALSE</text>
  <rect x="540" y="216" width="240" height="56" rx="6" fill="#fafaf7"/>
  <rect x="540" y="216" width="240" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
  <text x="660" y="241" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Result: TRUE</text><text x="660" y="256" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">empty subquery → NOT EXISTS</text>
  <polygon points="300,296 400,336 300,376 200,336" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
  <text x="300" y="332" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WHERE:</text><text x="300" y="348" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">is it TRUE?</text>
  <polygon points="660,296 760,336 660,376 560,336" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
  <text x="660" y="332" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WHERE:</text><text x="660" y="348" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">is it TRUE?</text>
  <rect x="180" y="416" width="240" height="56" rx="20" fill="#fafaf7"/>
  <rect x="180" y="416" width="240" height="56" rx="20" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="441" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Row dropped</text><text x="300" y="456" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">whole NOT IN query: 0 rows</text>
  <rect x="540" y="416" width="240" height="56" rx="20" fill="#fafaf7"/>
  <rect x="540" y="416" width="240" height="56" rx="20" fill="rgba(24,129,106,0.08)" stroke="#18816a" stroke-width="1"/>
  <text x="660" y="441" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Row kept</text><text x="660" y="456" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">whole NOT EXISTS query: 3 rows</text>
  <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(28,30,33,0.1)" stroke-width="0.8"/>
  <text x="40" y="520" fill="#525860" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="40" y="536" width="24" height="12" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.3)" stroke-width="1"/>
  <text x="72" y="546" fill="#525860" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>
  <rect x="165" y="536" width="24" height="12" rx="2" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
  <text x="197" y="546" fill="#525860" font-size="8.5" font-family="'Geist', sans-serif">Evaluation step</text>
  <polygon points="310,542 322,536 334,542 322,548" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
  <text x="342" y="546" fill="#525860" font-size="8.5" font-family="'Geist', sans-serif">WHERE filter</text>
  <rect x="440" y="536" width="24" height="12" rx="6" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="472" y="546" fill="#525860" font-size="8.5" font-family="'Geist', sans-serif">Row lost from the result</text>
  <line x1="629" y1="542" x2="651" y2="542" stroke="#18816a" stroke-width="1.4" marker-end="url(#not-in-vs-not-exists-arrow-accent)"/>
  <text x="661" y="546" fill="#525860" font-size="8.5" font-family="'Geist', sans-serif">Row survives</text>

</svg>
    </div>
  </div>
</body>
</html>
