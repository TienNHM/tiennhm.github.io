<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điều kiện ở WHERE hay ở ON</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafaf7;
      --color-ink:    #1c1e21;
      --color-muted:  #525860;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Thứ tự xử lý mệnh đề</p>
    <h1>Điều kiện ở WHERE hay ở ON</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="left-join-on-vs-where-title left-join-on-vs-where-desc">

  <desc id="left-join-on-vs-where-desc">kh và dh đi qua hai đường. Đặt d.tong &gt; 400 ở WHERE: LEFT JOIN ra 4 dòng với dòng Chi mang NULL, rồi WHERE tính NULL &gt; 400 thành UNKNOWN và loại dòng Chi, còn 2 dòng. Đặt điều kiện trong ON: LEFT JOIN giữ Chi với NULL, không có WHERE nào lọc thêm, ra 3 dòng.</desc>

  </defs>

  <rect x="232" y="112" width="240" height="72" rx="6" fill="#fafaf7"/>

  <text x="352" y="138" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LEFT JOIN</text><text x="352" y="153" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ON d.kh_id = k.id</text><text x="352" y="167" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ra 4 dòng · Chi: d.* = NULL</text>

  <rect x="232" y="312" width="240" height="72" rx="6" fill="#fafaf7"/>
  <rect x="232" y="312" width="240" height="72" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
  <text x="352" y="338" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LEFT JOIN</text><text x="352" y="353" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ON d.kh_id = k.id</text><text x="352" y="367" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AND d.tong &gt; 400</text>

  <line x1="40" y1="448" x2="920" y2="448" stroke="rgba(28,30,33,0.1)" stroke-width="0.8"/>
