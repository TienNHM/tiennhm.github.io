# Danh mục tag của blog.
#
# Mỗi tag khai báo `label` (tên hiển thị), `permalink` (đường dẫn) và
# `description` (mô tả, dùng cho thẻ meta của trang tag và hiển thị trên
# /blog/tags). Bài viết chỉ được dùng key đã khai báo ở đây — Docusaurus
# báo lỗi khi gặp tag lạ, nhờ đó danh mục không phình ra theo thời gian.

# ─── Nền tảng .NET ───────────────────────────────────────────────────────
dotnet:
  label: .NET
  permalink: /dotnet
  description: Runtime, GC, cấu hình và những hành vi của .NET chỉ lộ ra khi chạy thật trên production.

csharp:
  label: C#
  permalink: /csharp
  description: Ngôn ngữ C# ở mức thực dụng — async, bất biến, pattern matching và những cái bẫy hay gặp.

aspnetcore:
  label: ASP.NET Core
  permalink: /aspnet-core
  description: Pipeline, middleware, dependency injection và cách dựng Web API chịu được tải thật.

ef-core:
  label: EF Core
  permalink: /ef-core
  description: Truy vấn, change tracking, migration và các vấn đề hiệu năng đặc trưng của Entity Framework Core.

abp:
  label: ABP Framework
  permalink: /abp
  description: Unit of Work, module hoá và những quy ước riêng của ABP khi xây hệ thống nghiệp vụ.

# ─── Dữ liệu ─────────────────────────────────────────────────────────────
database:
  label: Database
  permalink: /database
  description: Thiết kế lược đồ, kiểu dữ liệu, ràng buộc và cách chọn công cụ lưu trữ cho từng bài toán.

sql:
  label: SQL
  permalink: /sql
  description: JOIN, window function, NULL ba trạng thái và những câu truy vấn trông đúng nhưng trả sai dữ liệu.

postgresql:
  label: PostgreSQL
  permalink: /postgresql
  description: MVCC, index, mức cô lập giao dịch và các đặc thù của PostgreSQL so với SQL Server.

concurrency:
  label: Đồng thời
  permalink: /concurrency
  description: Giao dịch, khoá, lost update, deadlock và những lỗi chỉ xuất hiện khi có nhiều người dùng cùng lúc.

# ─── Kiến trúc & backend ────────────────────────────────────────────────
architecture:
  label: Kiến trúc
  permalink: /architecture
  description: Ranh giới tầng, phụ thuộc và những quyết định thiết kế phải trả giá khi hệ thống lớn lên.

backend:
  label: Backend
  permalink: /backend
  description: "Những chủ đề nền của một backend chạy thật: dữ liệu, giao dịch, hiệu năng và vận hành."

microservices:
  label: Microservices
  permalink: /microservices
  description: Tách dịch vụ, message broker, giao tiếp bất đồng bộ và cái giá của hệ phân tán.

api:
  label: API
  permalink: /api
  description: Thiết kế REST, versioning, tài liệu OpenAPI và hợp đồng giữa server với client.

http:
  label: HTTP
  permalink: /http
  description: Header, mã hoá ký tự, chuẩn giao thức và những chỗ HTTP hành xử khác với trực giác.

security:
  label: Bảo mật
  permalink: /bao-mat
  description: Phân quyền, IDOR, HTTPS và các lỗ hổng phổ biến theo phân loại OWASP.

# ─── Vận hành ───────────────────────────────────────────────────────────
devops:
  label: DevOps
  permalink: /devops
  description: Triển khai, reverse proxy, chứng chỉ, máy chủ và công việc đưa phần mềm tới người dùng.

docker:
  label: Docker
  permalink: /docker
  description: Container hoá ứng dụng .NET, giới hạn tài nguyên và các khác biệt giữa image với máy thật.

performance:
  label: Hiệu năng
  permalink: /hieu-nang
  description: Đo trước khi tối ưu — bộ nhớ, độ trễ, thời gian build và những con số đo được.

troubleshooting:
  label: Gỡ rối
  permalink: /go-roi
  description: Lần theo dấu vết một sự cố thật trên production cho tới tận nguyên nhân gốc.

# ─── Frontend ───────────────────────────────────────────────────────────
angular:
  label: Angular
  permalink: /angular
  description: Angular từ góc nhìn người làm backend — build, thư viện giao diện và tối ưu thời gian biên dịch.

frontend:
  label: Frontend
  permalink: /frontend
  description: Thư viện giao diện, công cụ build và những lựa chọn ảnh hưởng tới trải nghiệm người dùng.

javascript:
  label: JavaScript
  permalink: /javascript
  description: JavaScript và Node.js — hàm tiện ích, tài nguyên học và các vấn đề gặp khi chạy trong container.

# ─── AI ─────────────────────────────────────────────────────────────────
ai:
  label: AI
  permalink: /ai
  description: Học máy, mô hình sinh và cách đưa AI vào một hệ thống phần mềm đang chạy.

ai-driven-development:
  label: AI-Driven Development
  permalink: /ai-driven-development
  description: Quy trình phát triển phần mềm có AI tham gia — cách làm, chỉ số đo và những rủi ro đi kèm.

ai-tools:
  label: Công cụ AI
  permalink: /cong-cu-ai
  description: ChatGPT, Cursor, GitHub Copilot và cách dùng chúng trong công việc lập trình hằng ngày.

# ─── Nền tảng khoa học máy tính ─────────────────────────────────────────
computer-science:
  label: Khoa học máy tính
  permalink: /khoa-hoc-may-tinh
  description: Biểu diễn dữ liệu, hệ đếm và những nền tảng giải thích vì sao máy tính hành xử như vậy.

fundamentals:
  label: Kiến thức nền
  permalink: /kien-thuc-nen
  description: Những khái niệm nền mà mọi lập trình viên đều dùng tới, bất kể ngôn ngữ hay framework.

# ─── Công cụ & nghề nghiệp ──────────────────────────────────────────────
git:
  label: Git & GitHub
  permalink: /git
  description: Quy trình làm việc với Git, hồ sơ GitHub và các mẹo trình bày kho mã nguồn.

tools:
  label: Công cụ
  permalink: /cong-cu
  description: Trình soạn thảo, tiện ích mở rộng và những công cụ nhỏ giúp công việc hằng ngày nhẹ đi.

testing:
  label: Kiểm thử
  permalink: /kiem-thu
  description: Các loại kiểm thử, phạm vi của từng loại và cách chọn mức kiểm thử phù hợp.

learning:
  label: Học tập
  permalink: /hoc-tap
  description: Lộ trình, tài nguyên và cách học một công nghệ mới cho tới mức dùng được thật.

career:
  label: Nghề nghiệp
  permalink: /nghe-nghiep
  description: Vai trò, kỹ năng và những lựa chọn nghề nghiệp của người làm kỹ thuật phần mềm.
