<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm tra trạng thái an toàn trong giải thuật Banker</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Giải thuật Banker</p>
    <h1>Kiểm tra trạng thái an toàn trong giải thuật Banker</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 572" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banker-safety-dark-title banker-safety-dark-desc">
  <title id="banker-safety-dark-title">Thuật toán kiểm tra an toàn của Banker</title>
  <desc id="banker-safety-dark-desc">Khởi tạo Work bằng Available, lặp tìm tiến trình chưa xong có Need không vượt Work, giả sử nó chạy xong và trả Allocation vào Work; nếu mọi tiến trình đều xong thì trạng thái an toàn, ngược lại không an toàn.</desc>
  <defs>
    <marker id="banker-safety-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
    <marker id="banker-safety-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#1b1b1d"/>
  <!-- Arrows first -->
  <line x1="480" y1="72" x2="480" y2="112" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#banker-safety-dark-arrow)"/>
  <line x1="650" y1="184" x2="700" y2="184" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#banker-safety-dark-arrow)"/>
  <path d="M820 148 V100 Q820 92 812 92 H484" stroke="#b4b9c0" stroke-width="1.2" fill="none"/>
  <line x1="480" y1="256" x2="480" y2="304" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#banker-safety-dark-arrow)"/>
  <line x1="630" y1="376" x2="700" y2="376" stroke="#25c19f" stroke-width="1.4" fill="none" marker-end="url(#banker-safety-dark-arrow-accent)"/>
  <line x1="330" y1="376" x2="264" y2="376" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#banker-safety-dark-arrow)"/>
  <!-- Labels -->
  <rect x="652" y="72" width="56" height="12" rx="2" fill="#1b1b1d"/><text x="680" y="81" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LẶP LẠI</text>
  <rect x="661" y="164" width="28" height="12" rx="2" fill="#1b1b1d"/><text x="675" y="173" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
  <rect x="496" y="274" width="44" height="12" rx="2" fill="#1b1b1d"/><text x="518" y="283" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>
  <rect x="651" y="356" width="28" height="12" rx="2" fill="#1b1b1d"/><text x="665" y="365" fill="#25c19f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
  <rect x="275" y="356" width="44" height="12" rx="2" fill="#1b1b1d"/><text x="297" y="365" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>
  <!-- Merge dot -->
  <circle cx="480" cy="92" r="4" fill="#e3e3e3"/>
  <!-- Start -->
  <rect x="320" y="20" width="320" height="52" rx="20" fill="#1b1b1d"/>
  <rect x="320" y="20" width="320" height="52" rx="20" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.3)" stroke-width="1"/>
  <text x="480" y="42" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khởi tạo</text>
  <text x="480" y="59" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Work = Available · Finish[i] = false</text>
  <!-- Decision 1 -->
  <polygon points="480,112 650,184 480,256 310,184" fill="#1b1b1d"/>
  <polygon points="480,112 650,184 480,256 310,184" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="480" y="180" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Còn Pi chưa xong mà</text>
  <text x="480" y="196" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Need_i ≤ Work?</text>
  <!-- Step: Pi finishes -->
  <rect x="700" y="140" width="240" height="88" rx="6" fill="#1b1b1d"/>
  <rect x="700" y="140" width="240" height="88" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="820" y="166" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pi chạy xong, trả tài nguyên</text>
  <text x="820" y="186" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Work = Work + Allocation_i</text>
  <text x="820" y="200" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Finish[i] = true</text>
  <text x="820" y="214" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nối Pi vào chuỗi an toàn</text>
  <!-- Decision 2 -->
  <polygon points="480,304 630,376 480,448 330,376" fill="#1b1b1d"/>
  <polygon points="480,304 630,376 480,448 330,376" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="480" y="372" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mọi Finish[i]</text>
  <text x="480" y="388" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đều true?</text>
  <!-- End: safe (focal) -->
  <rect x="700" y="348" width="240" height="56" rx="20" fill="#1b1b1d"/>
  <rect x="700" y="348" width="240" height="56" rx="20" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>
  <text x="820" y="372" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trạng thái an toàn</text>
  <text x="820" y="389" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đã có chuỗi an toàn</text>
  <!-- End: unsafe -->
  <rect x="24" y="348" width="240" height="56" rx="20" fill="#1b1b1d"/>
  <rect x="24" y="348" width="240" height="56" rx="20" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.3)" stroke-width="1"/>
  <text x="144" y="372" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không an toàn</text>
  <text x="144" y="389" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">có thể dẫn tới deadlock</text>
  <!-- Note: Need -->
  <text x="40" y="160" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">GHI CHÚ</text>
  <text x="40" y="180" fill="#e3e3e3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Need_i = Max_i − Allocation_i</text>
  <text x="40" y="198" fill="#b4b9c0" font-size="9.5" font-family="'Geist', sans-serif" text-anchor="start">Need ≤ Work: so từng loại tài nguyên</text>
  <!-- Legend -->
  <line x1="40" y1="476" x2="920" y2="476" stroke="rgba(227,227,227,0.1)" stroke-width="0.8"/>
  <text x="40" y="496" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">CHÚ GIẢI</text>
  <rect x="40" y="512" width="24" height="12" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.3)" stroke-width="1"/>
  <text x="72" y="522" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Bắt đầu / kết thúc</text>
  <rect x="220" y="512" width="24" height="12" rx="2" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="252" y="522" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Bước xử lý</text>
  <polygon points="380,518 392,512 404,518 392,524" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="412" y="522" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Rẽ nhánh</text>
  <circle cx="552" cy="518" r="4" fill="#e3e3e3"/>
  <text x="564" y="522" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Điểm nhập nhánh</text>
  <line x1="700" y1="518" x2="728" y2="518" stroke="#25c19f" stroke-width="1.4" marker-end="url(#banker-safety-dark-arrow-accent)"/>
  <text x="736" y="522" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Kết quả mong muốn</text>
<text id="tiennhm-copyright" x="936" y="560" text-anchor="end" fill="#b4b9c0" opacity="0.75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
