<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Số Virtual User theo thời gian với options.stages</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line chart · k6 stages</p>
    <h1>Số Virtual User theo thời gian với options.stages</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 532" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="k6-stages-dark-title k6-stages-dark-desc">
  <title id="k6-stages-dark-title">Số VU theo thời gian: stages so với --vus cố định</title>
  <desc id="k6-stages-dark-desc">Với stages, số VU tăng từ 0 lên 20 trong 30 giây, giảm về 10 trong 1 phút 30 giây rồi về 0 trong 20 giây; với --vus 10 --duration 30s, số VU giữ cố định 10 trong 30 giây.</desc>
  <defs>
    <marker id="k6-stages-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
    <marker id="k6-stages-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#1b1b1d"/>
  <!-- Stage bands -->
  <line x1="260" y1="40" x2="260" y2="400" stroke="rgba(227,227,227,0.2)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="800" y1="40" x2="800" y2="400" stroke="rgba(227,227,227,0.2)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="170.0" y="36" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAGE 1 · 30s → 20 VU</text>
  <text x="530.0" y="36" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAGE 2 · 1m30s → 10 VU</text>
  <text x="860.0" y="36" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAGE 3 · 20s → 0</text>
  <!-- Gridlines + y labels -->
  <line x1="80" y1="314" x2="920" y2="314" stroke="rgba(227,227,227,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="228" x2="920" y2="228" stroke="rgba(227,227,227,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="142" x2="920" y2="142" stroke="rgba(227,227,227,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="56" x2="920" y2="56" stroke="rgba(227,227,227,0.08)" stroke-width="0.8"/>
  <text x="72" y="403.0" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0</text>
  <text x="72" y="317.0" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">5</text>
  <text x="72" y="231.0" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">10</text>
  <text x="72" y="145.0" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">15</text>
  <text x="72" y="59.0" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">20</text>
  <line x1="80" y1="40" x2="80" y2="400" stroke="rgba(227,227,227,0.25)" stroke-width="1"/>
  <line x1="80" y1="400" x2="920" y2="400" stroke="rgba(227,227,227,0.25)" stroke-width="1"/>
  <text transform="rotate(-90 28 228)" x="28" y="228" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">SỐ VU ĐANG CHẠY</text>
  <!-- x labels -->
  <text x="80.0" y="418" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0s</text>
  <text x="260.0" y="418" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">30s</text>
  <text x="440.0" y="418" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1m</text>
  <text x="620.0" y="418" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1m30s</text>
  <text x="800.0" y="418" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2m</text>
  <text x="920.0" y="418" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2m20s</text>
  <text x="920" y="436" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">THỜI GIAN</text>
  <!-- Series: --vus 10 --duration 30s -->
  <polyline points="80,228 260,228 260,400" fill="none" stroke="#b4b9c0" stroke-width="1.2" stroke-dasharray="5,4" stroke-linejoin="round"/>
  <!-- Series: stages (focal) -->
  <polygon points="80,400 260,56 800,228 920,400 920,400 80,400" fill="rgba(37,193,159,0.10)"/>
  <polyline points="80,400 260,56 800,228 920,400" fill="none" stroke="#25c19f" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="80" cy="400" r="4" fill="#25c19f"/>
  <circle cx="260" cy="56" r="4" fill="#25c19f"/>
  <circle cx="800" cy="228" r="4" fill="#25c19f"/>
  <circle cx="920" cy="400" r="4" fill="#25c19f"/>
  <!-- Vertex values -->
  <text x="270.0" y="48.0" fill="#e3e3e3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">20 VU</text>
  <text x="810.0" y="220.0" fill="#e3e3e3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">10 VU</text>
  <!-- Legend -->
  <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(227,227,227,0.1)" stroke-width="0.8"/>
  <text x="40" y="472" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">CHÚ GIẢI</text>
  <line x1="40" y1="488" x2="64" y2="488" stroke="#25c19f" stroke-width="1.8"/>
  <circle cx="52" cy="488" r="4" fill="#25c19f"/>
  <text x="72" y="491" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">options.stages: VU tăng / giảm tuyến tính trong từng giai đoạn</text>
  <line x1="440" y1="488" x2="464" y2="488" stroke="#b4b9c0" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="472" y="491" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">--vus 10 --duration 30s: số VU cố định</text>
<text id="tiennhm-copyright" x="936" y="520" text-anchor="end" fill="#b4b9c0" opacity="0.75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
