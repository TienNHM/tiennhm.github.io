<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveChangesAsync writes to the database, CompleteAsync commits</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,400;1,62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Unit of Work in ABP</p>
    <h1>SaveChangesAsync writes to the database, CompleteAsync commits</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 524" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="abp-uow-savechanges-complete-dark-title abp-uow-savechanges-complete-dark-desc">
  <title id="abp-uow-savechanges-complete-dark-title">The life of an ambient Unit of Work in ABP</title>
  <desc id="abp-uow-savechanges-complete-dark-desc">The interceptor opens a UoW, InsertAsync records into the change tracker, SaveChangesAsync sends SQL without committing; an exception rolls everything back, otherwise CompleteAsync commits and only then do OnCompleted callbacks run.</desc>
<defs>
  <marker id="abp-uow-savechanges-complete-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
  <marker id="abp-uow-savechanges-complete-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>
</defs>
<rect width="100%" height="100%" fill="#1b1b1d"/>
<rect x="24" y="48" width="712" height="280" rx="8" fill="rgba(227,227,227,0.02)" stroke="rgba(227,227,227,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
<text x="40" y="68" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">UOW TRANSACTION · STILL OPEN</text>
<path d="M240 116 H286" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#abp-uow-savechanges-complete-dark-arrow)"/>
<path d="M464 116 H510" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#abp-uow-savechanges-complete-dark-arrow)"/>
<path d="M612 144 V218" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#abp-uow-savechanges-complete-dark-arrow)"/>
<path d="M700 264 H758" stroke="#25c19f" stroke-width="1.4" fill="none" marker-end="url(#abp-uow-savechanges-complete-dark-arrow-accent)"/>
<path d="M612 308 V370" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#abp-uow-savechanges-complete-dark-arrow)"/>
<path d="M840 292 V354" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#abp-uow-savechanges-complete-dark-arrow)"/>
<rect x="718.5" y="244" width="21" height="12" rx="2" fill="#1b1b1d"/><text x="729" y="253" fill="#25c19f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
<rect x="620" y="333" width="27" height="12" rx="2" fill="#1b1b1d"/><text x="625" y="342" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.12em">YES</text>
<rect x="722" y="334" width="110" height="12" rx="2" fill="#1b1b1d"/><text x="827" y="343" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.12em">ONLY AFTER COMMIT</text>
<rect x="40" y="88" width="200" height="56" rx="6" fill="#1b1b1d"/><rect x="40" y="88" width="200" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="140" y="112" fill="#e3e3e3" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Ambient UoW opens</text>
<text x="140" y="128" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">interceptor · IUnitOfWorkEnabled</text>
<rect x="288" y="88" width="176" height="56" rx="6" fill="#1b1b1d"/><rect x="288" y="88" width="176" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="376" y="112" fill="#e3e3e3" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">InsertAsync</text>
<text x="376" y="128" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">change tracker</text>
<rect x="512" y="88" width="200" height="56" rx="6" fill="#1b1b1d"/><rect x="512" y="88" width="200" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="612" y="112" fill="#e3e3e3" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">SaveChangesAsync</text>
<text x="612" y="128" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">writes to DB, no commit</text>
<polygon points="612,220 700,264 612,308 524,264" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="612" y="261" fill="#e3e3e3" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Exception</text>
<text x="612" y="275" fill="#e3e3e3" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">later on?</text>
<rect x="760" y="236" width="160" height="56" rx="6" fill="#1b1b1d"/><rect x="760" y="236" width="160" height="56" rx="6" fill="rgba(37,193,159,0.1)" stroke="#25c19f" stroke-width="1"/>
<text x="840" y="260" fill="#e3e3e3" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">CompleteAsync</text>
<text x="840" y="276" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">final save + commit</text>
<rect x="760" y="356" width="160" height="56" rx="6" fill="#1b1b1d"/><rect x="760" y="356" width="160" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="840" y="380" fill="#e3e3e3" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">OnCompleted</text>
<text x="840" y="396" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">email · notification</text>
<rect x="516" y="372" width="192" height="56" rx="6" fill="#1b1b1d"/><rect x="516" y="372" width="192" height="56" rx="6" fill="rgba(227,227,227,0.05)" stroke="#b4b9c0" stroke-width="1"/>
<text x="612" y="396" fill="#e3e3e3" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Roll back everything</text>
<text x="612" y="412" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">including what was saved</text>
<text x="48" y="236" fill="#e3e3e3" font-size="14" font-family="'Noto Serif Display', serif" text-anchor="start" font-style="italic">SaveChangesAsync only pushes SQL to the database.</text>
<text x="48" y="258" fill="#e3e3e3" font-size="14" font-family="'Noto Serif Display', serif" text-anchor="start" font-style="italic">The transaction is still open, a later error rolls it back.</text>
<line x1="40" y1="452" x2="920" y2="452" stroke="rgba(227,227,227,0.1)" stroke-width="0.8"/>
<text x="40" y="472" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="477" width="24" height="12" rx="2" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="72" y="486" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Step</text>
<polygon points="240,483 252,477 264,483 252,489" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="272" y="486" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Decision</text>
<line x1="440" y1="483" x2="468" y2="483" stroke="#25c19f" stroke-width="1.4" marker-end="url(#abp-uow-savechanges-complete-dark-arrow-accent)"/>
<text x="476" y="486" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Commit path</text>
<rect x="640" y="477" width="24" height="12" rx="2" fill="rgba(227,227,227,0.02)" stroke="rgba(227,227,227,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
<text x="672" y="486" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Open transaction</text>
<text id="tiennhm-copyright" x="936" y="512" text-anchor="end" fill="#b4b9c0" opacity="0.75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
