<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key lookup và covering index</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Kiến trúc · Index</p>
    <h1>Key lookup và covering index</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 572" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="key-lookup-dark-title key-lookup-dark-desc">
  <title id="key-lookup-dark-title">Key lookup so với covering index</title>
  <desc id="key-lookup-dark-desc">Cùng truy vấn WHERE Status = 'New': index chỉ có Status phải quay về index gom cụm cho mỗi dòng (key lookup), còn covering index có INCLUDE đủ cột nên trả kết quả ngay từ tầng lá.</desc>
  <defs>
    <marker id="key-lookup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
    <marker id="key-lookup-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="548" fill="#1b1b1d"/>
  <!-- zones -->
  <rect x="40" y="120" width="432" height="320" rx="8" fill="rgba(227,227,227,0.02)" stroke="rgba(227,227,227,0.16)" stroke-width="0.8"/>
  <rect x="295.2" y="114" width="161" height="12" rx="2" fill="#1b1b1d"/>
  <text x="376" y="123" fill="#b4b9c0" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">IX_LEADS_STATUS (STATUS)</text>
  <rect x="488" y="120" width="432" height="320" rx="8" fill="rgba(227,227,227,0.02)" stroke="rgba(227,227,227,0.16)" stroke-width="0.8"/>
  <rect x="743.2" y="114" width="161" height="12" rx="2" fill="#1b1b1d"/>
  <text x="824" y="123" fill="#b4b9c0" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">IX_LEADS_STATUS_COVERING</text>
  <!-- arrows -->
  <path d="M440,72 V84 Q440,92 432,92 H168 Q160,92 160,100 V152" fill="none" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#key-lookup-arrow)"/>
  <path d="M520,72 V84 Q520,92 528,92 H600 Q608,92 608,100 V152" fill="none" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#key-lookup-arrow)"/>
  <path d="M160,208 V248" fill="none" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#key-lookup-arrow)"/>
  <path d="M160,304 V352" fill="none" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#key-lookup-arrow)"/>
  <path d="M608,208 V248" fill="none" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#key-lookup-arrow)"/>
  <path d="M608,304 V352" fill="none" stroke="#25c19f" stroke-width="1.4" marker-end="url(#key-lookup-arrow-accent)"/>
  <!-- labels -->
  <rect x="168" y="322" width="95" height="12" rx="2" fill="#1b1b1d"/><text x="216" y="331" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEY LOOKUP × N</text>
  <!-- nodes -->
  <rect x="360" y="24" width="240" height="48" rx="6" fill="#1b1b1d"/>
  <rect x="360" y="24" width="240" height="48" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.3)" stroke-width="1"/>
  <text x="480.0" y="45.0" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Truy vấn</text>
  <text x="480.0" y="60.0" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WHERE Status = 'New'</text>
  <rect x="72" y="152" width="176" height="56" rx="6" fill="#1b1b1d"/>
  <rect x="72" y="152" width="176" height="56" rx="6" fill="rgba(227,227,227,0.05)" stroke="#b4b9c0" stroke-width="1"/>
  <text x="160.0" y="177.0" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seek trên B-tree</text>
  <text x="160.0" y="192.0" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">khoá: Status</text>
  <rect x="72" y="248" width="176" height="56" rx="6" fill="#1b1b1d"/>
  <rect x="72" y="248" width="176" height="56" rx="6" fill="rgba(227,227,227,0.05)" stroke="#b4b9c0" stroke-width="1"/>
  <text x="160.0" y="273.0" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tầng lá</text>
  <text x="160.0" y="288.0" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Status + LeadId</text>
  <rect x="72" y="352" width="176" height="56" rx="6" fill="#1b1b1d"/>
  <rect x="72" y="352" width="176" height="56" rx="6" fill="rgba(227,227,227,0.05)" stroke="#b4b9c0" stroke-width="1"/>
  <text x="160.0" y="377.0" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Index gom cụm</text>
  <text x="160.0" y="392.0" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đọc cột còn thiếu</text>
  <rect x="520" y="152" width="176" height="56" rx="6" fill="#1b1b1d"/>
  <rect x="520" y="152" width="176" height="56" rx="6" fill="rgba(227,227,227,0.05)" stroke="#b4b9c0" stroke-width="1"/>
  <text x="608.0" y="177.0" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seek trên B-tree</text>
  <text x="608.0" y="192.0" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">khoá: Status, CreatedAt</text>
  <rect x="520" y="248" width="176" height="56" rx="6" fill="#1b1b1d"/>
  <rect x="520" y="248" width="176" height="56" rx="6" fill="rgba(227,227,227,0.05)" stroke="#b4b9c0" stroke-width="1"/>
  <text x="608.0" y="273.0" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tầng lá</text>
  <text x="608.0" y="288.0" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ INCLUDE(CompanyName, …)</text>
  <rect x="520" y="352" width="176" height="56" rx="20" fill="#1b1b1d"/>
  <rect x="520" y="352" width="176" height="56" rx="20" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>
  <text x="608.0" y="377.0" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả kết quả</text>
  <text x="608.0" y="392.0" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">không có key lookup</text>
  <!-- top -->
  <text x="280" y="260" fill="#b4b9c0" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Tầng lá thiếu CompanyName,</text>
  <text x="280" y="275" fill="#b4b9c0" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">EstimatedValue: mỗi dòng</text>
  <text x="280" y="290" fill="#b4b9c0" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">phải quay về bảng.</text>
  <text x="280" y="368" fill="#b4b9c0" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">50.000 dòng = 50.000 lần</text>
  <text x="280" y="383" fill="#b4b9c0" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">tra cứu ngẫu nhiên; optimizer</text>
  <text x="280" y="398" fill="#b4b9c0" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">thường bỏ index, quét bảng.</text>
  <text x="728" y="260" fill="#b4b9c0" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Index chứa mọi cột</text>
  <text x="728" y="275" fill="#b4b9c0" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">truy vấn cần: đọc xong</text>
  <text x="728" y="290" fill="#b4b9c0" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">ngay ở tầng lá.</text>
  <line x1="40" y1="468" x2="920" y2="468" stroke="rgba(227,227,227,0.1)" stroke-width="0.8"/>
  <text x="40" y="488" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
  <rect x="40" y="498" width="24" height="12" rx="2" fill="rgba(227,227,227,0.05)" stroke="#b4b9c0" stroke-width="1"/>
  <text x="74" y="507" fill="#b4b9c0" font-size="9" font-family="'Geist', sans-serif">Cấu trúc index (B-tree)</text>
  <line x1="238.79999999999998" y1="504" x2="264.79999999999995" y2="504" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#key-lookup-arrow)"/>
  <text x="272.79999999999995" y="507" fill="#b4b9c0" font-size="9" font-family="'Geist', sans-serif">Bước đọc</text>
  <line x1="353.59999999999997" y1="504" x2="379.59999999999997" y2="504" stroke="#25c19f" stroke-width="1.2" marker-end="url(#key-lookup-arrow-accent)"/>
  <text x="387.59999999999997" y="507" fill="#b4b9c0" font-size="9" font-family="'Geist', sans-serif">Không cần quay về bảng</text>
  <rect x="546.8" y="498" width="24" height="12" rx="2" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>
  <text x="580.8" y="507" fill="#b4b9c0" font-size="9" font-family="'Geist', sans-serif">Kết quả</text>
<text id="tiennhm-copyright" x="936" y="560" text-anchor="end" fill="#b4b9c0" opacity="0.75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
