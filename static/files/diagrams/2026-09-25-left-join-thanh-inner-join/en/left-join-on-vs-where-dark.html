<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Condition in WHERE or in ON</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Clause processing order</p>
    <h1>Condition in WHERE or in ON</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="left-join-on-vs-where-dark-title left-join-on-vs-where-dark-desc">
  <title id="left-join-on-vs-where-dark-title">Condition in WHERE or in ON</title>
  <desc id="left-join-on-vs-where-dark-desc">kh and dh go down two paths. With d.tong &gt; 400 in WHERE, LEFT JOIN yields 4 rows with Chi's row holding NULL, then WHERE evaluates NULL &gt; 400 as UNKNOWN and drops Chi, leaving 2 rows. With the condition in ON, LEFT JOIN keeps Chi with NULL, no WHERE filters it, and the result is 3 rows.</desc>
  <defs>
    <marker id="left-join-on-vs-where-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
    <marker id="left-join-on-vs-where-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#1b1b1d"/>
  <rect x="216" y="40" width="272" height="384" rx="8" fill="rgba(227,227,227,0.04)" stroke="rgba(227,227,227,0.1)" stroke-width="1"/>
  <text x="228" y="60" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">STEP 1 · FROM + JOIN … ON</text>
  <rect x="504" y="40" width="208" height="384" rx="8" fill="rgba(227,227,227,0.04)" stroke="rgba(227,227,227,0.1)" stroke-width="1"/>
  <text x="516" y="60" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">STEP 2 · WHERE</text>
  <rect x="728" y="40" width="200" height="384" rx="8" fill="rgba(227,227,227,0.04)" stroke="rgba(227,227,227,0.1)" stroke-width="1"/>
  <text x="740" y="60" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">RESULT</text>
  <text x="232" y="100" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">CONDITION IN WHERE</text>
  <text x="232" y="300" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">CONDITION IN ON</text>
  <path d="M176 236 H188 Q196 236 196 228 V156 Q196 148 204 148 H232" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#left-join-on-vs-where-dark-arrow)"/>
  <path d="M176 260 H188 Q196 260 196 268 V340 Q196 348 204 348 H232" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#left-join-on-vs-where-dark-arrow)"/>
  <path d="M472 148 L520 148" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#left-join-on-vs-where-dark-arrow)"/>
  <path d="M696 148 L744 148" stroke="#b4b9c0" stroke-width="1.2" fill="none" marker-end="url(#left-join-on-vs-where-dark-arrow)"/>
  <path d="M472 348 L744 348" stroke="#25c19f" stroke-width="1.4" fill="none" marker-end="url(#left-join-on-vs-where-dark-arrow-accent)"/>
  <rect x="578" y="330" width="60" height="12" rx="2" fill="#1b1b1d"/><text x="608" y="339" fill="#25c19f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO WHERE</text>
  <rect x="32" y="220" width="144" height="56" rx="6" fill="#1b1b1d"/>
  <rect x="32" y="220" width="144" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="104" y="245" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kh + dh</text><text x="104" y="260" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 customers · 3 orders</text>
  <rect x="232" y="112" width="240" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="232" y="112" width="240" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="352" y="138" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LEFT JOIN</text><text x="352" y="153" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ON d.kh_id = k.id</text><text x="352" y="167" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 rows · Chi: d.* = NULL</text>
  <rect x="520" y="112" width="176" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="520" y="112" width="176" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="608" y="138" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WHERE d.tong &gt; 400</text><text x="608" y="153" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NULL &gt; 400 → UNKNOWN</text><text x="608" y="167" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Chi's row is dropped</text>
  <rect x="744" y="112" width="168" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="744" y="112" width="168" height="72" rx="6" fill="rgba(227,227,227,0.02)" stroke="rgba(227,227,227,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="828" y="138" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2 rows</text><text x="828" y="153" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">An 500 · Binh 700</text><text x="828" y="167" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Chi is gone</text>
  <rect x="232" y="312" width="240" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="232" y="312" width="240" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="352" y="338" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LEFT JOIN</text><text x="352" y="353" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ON d.kh_id = k.id</text><text x="352" y="367" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AND d.tong &gt; 400</text>
  <rect x="744" y="312" width="168" height="72" rx="6" fill="#1b1b1d"/>
  <rect x="744" y="312" width="168" height="72" rx="6" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>
  <text x="828" y="338" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3 rows</text><text x="828" y="353" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">An 500 · Binh 700</text><text x="828" y="367" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Chi · NULL</text>
  <line x1="40" y1="448" x2="920" y2="448" stroke="rgba(227,227,227,0.1)" stroke-width="0.8"/>
  <text x="40" y="468" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="40" y="484" width="24" height="12" rx="3" fill="rgba(227,227,227,0.04)" stroke="rgba(227,227,227,0.1)" stroke-width="1"/>
  <text x="72" y="494" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif">Logical processing order</text>
  <rect x="229" y="484" width="24" height="12" rx="2" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="261" y="494" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif">Clause</text>
  <rect x="330" y="484" width="24" height="12" rx="2" fill="rgba(227,227,227,0.02)" stroke="rgba(227,227,227,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="362" y="494" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif">Result missing rows</text>
  <rect x="495" y="484" width="24" height="12" rx="2" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>
  <text x="527" y="494" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif">Intended result</text>

</svg>
    </div>
  </div>
