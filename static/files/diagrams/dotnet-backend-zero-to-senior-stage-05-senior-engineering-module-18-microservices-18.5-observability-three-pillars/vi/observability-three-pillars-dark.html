<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metric báo động, trace chỉ chỗ, log nói lý do</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Observability</p>
    <h1>Metric báo động, trace chỉ chỗ, log nói lý do</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 444" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obs3-dark-title obs3-dark-desc">
  <title id="obs3-dark-title">Ba trụ cột observability khi điều tra sự cố</title>
  <desc id="obs3-dark-desc">Service crm-sales phát metric, trace và log; khi có sự cố, metric báo p99 của /api/orders tăng từ 200ms lên 3s, trace chỉ ra 2,8s nằm ở lời gọi Inventory Service, và log của span đó, tìm qua TraceId, cho biết nguyên nhân là connection pool exhausted.</desc>
  <defs>
    <marker id="obs3-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
    <marker id="obs3-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#1b1b1d"/>
  <path d="M400 96 V128 Q400 136 392 136 H160 Q152 136 152 144 V176" stroke="#b4b9c0" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#obs3-dark-arrow)"/>
  <line x1="480" y1="96" x2="480" y2="176" stroke="#b4b9c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#obs3-dark-arrow)"/>
  <path d="M560 96 V128 Q560 136 568 136 H800 Q808 136 808 144 V176" stroke="#b4b9c0" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#obs3-dark-arrow)"/>
  <line x1="264" y1="252" x2="368" y2="252" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#obs3-dark-arrow)"/>
  <line x1="592" y1="252" x2="696" y2="252" stroke="#25c19f" stroke-width="1.4" marker-end="url(#obs3-dark-arrow-accent)"/>
  <rect x="284" y="232" width="64" height="12" rx="2" fill="#1b1b1d"/><text x="316" y="241" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">MỞ TRACE</text>
  <rect x="606" y="232" width="76" height="12" rx="2" fill="#1b1b1d"/><text x="644" y="241" fill="#25c19f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LỌC TRACEID</text>
  <rect x="320" y="40" width="320" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="480" y="65" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">crm-sales</text>
  <text x="480" y="81" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenTelemetry · Serilog Enrich.WithSpan()</text>
  <rect x="40" y="176" width="224" height="152" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="56" y="200" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">1 · METRICS</text>
  <text x="56" y="224" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Báo động</text>
  <text x="56" y="242" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif">Xu hướng và sức khoẻ ra sao?</text>
  <line x1="56" y1="260" x2="248" y2="260" stroke="rgba(227,227,227,0.10)" stroke-width="0.8"/>
  <text x="56" y="284" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace">p99 /api/orders</text>
  <text x="56" y="302" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace">200ms → 3s</text>
  <rect x="368" y="176" width="224" height="152" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="384" y="200" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">2 · TRACES</text>
  <text x="384" y="224" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Tìm chặng chậm</text>
  <text x="384" y="242" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif">Request chậm ở chặng nào?</text>
  <line x1="384" y1="260" x2="576" y2="260" stroke="rgba(227,227,227,0.10)" stroke-width="0.8"/>
  <text x="384" y="284" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace">2,8s nằm ở lời gọi</text>
  <text x="384" y="302" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace">Inventory Service</text>
  <rect x="696" y="176" width="224" height="152" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
  <text x="712" y="200" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">3 · LOGS</text>
  <text x="712" y="224" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Tìm nguyên nhân</text>
  <text x="712" y="242" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif">Chuyện gì xảy ra với request?</text>
  <line x1="712" y1="260" x2="904" y2="260" stroke="rgba(227,227,227,0.10)" stroke-width="0.8"/>
  <text x="712" y="284" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace">"Connection pool</text>
  <text x="712" y="302" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace">exhausted"</text>
  <line x1="40" y1="360" x2="920" y2="360" stroke="rgba(227,227,227,0.10)" stroke-width="0.8"/>
  <text x="40" y="380" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
  <line x1="40" y1="398" x2="68" y2="398" stroke="#b4b9c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#obs3-dark-arrow)"/>
  <text x="76" y="401" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif">Tín hiệu service phát ra</text>
  <line x1="260" y1="398" x2="288" y2="398" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#obs3-dark-arrow)"/>
  <text x="296" y="401" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif">Bước điều tra tiếp theo</text>
  <line x1="480" y1="398" x2="508" y2="398" stroke="#25c19f" stroke-width="1.4" marker-end="url(#obs3-dark-arrow-accent)"/>
  <text x="516" y="401" fill="#b4b9c0" font-size="8.5" font-family="'Geist', sans-serif">Nối log với trace qua TraceId trên mọi dòng log</text>
<text id="tiennhm-copyright" x="936" y="432" text-anchor="end" fill="#b4b9c0" opacity="0.75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
